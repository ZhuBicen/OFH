log:
  filename: stdout
  level: info

dvb_tx_sim:
   cells:
    - network_interface: lo        # Use BDF instead of interface name for DPDK
      src_mac_addr: 6c:b3:11:60:4f:d8          # MAC address of the RU
      dst_mac_addr: 8c:1f:64:a5:df:05          # MAC address of the DU
      enable_promiscuous: true               # Promiscuous mode flag
#      vlan_tag: 33                            # VLAN tag
      mtu: 2048
      variable_mtu: true
      gps_alpha: 0
      gps_beta: 0
      frame_period: 8541666
      input_file: /tmp/input_stream2
      output_file: /tmp/output_stream2
      enable_check_crc: true                       # Speed factor for simulation
      initial_num_of_packet: 0             # Initial number of packets to send
      packet_delay_in_nano_seconds: 2500    # Delay between packets in nanoseconds
      bitrate: 500                     # Mbps

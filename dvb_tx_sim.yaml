log:
  filename: stdout
  level: info

dvb_tx_sim:
   cells:
    - network_interface: lo        # Use BDF instead of interface name for DPDK
     #- network_interface: 0000:65:00.1        # Use BDF instead of interface name for DPDK
      src_mac_addr: 6c:b3:11:60:4f:da          # MAC address of the RU
      dst_mac_addr: 8c:1f:64:a5:df:05          # MAC address of the DU
      enable_promiscuous: true               # Promiscuous mode flag
      vlan_tag:  33                            # VLAN tag
      mtu: 2048
      gps_alpha: 0
      gps_beta: 0
      frame_period: 8541666
      file: ~/input.mp4

        #dpdk:
        #   eal_args: "--lcores (0-1)@(0-15)"
